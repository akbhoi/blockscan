[package]
name = "blockscan"
version = "1.0.0"
edition = "2024"
description = "blockscan is a high-performance CLI security tool built in Rust to analyze website bot-blocking behavior and extract valid, crawlable links."
license = "MIT"
repository = "https://github.com/akbhoi/blockscan"
homepage = "https://github.com/akbhoi/blockscan"
readme = "README.md"
authors = ["Ashish Bhoi <ashish.bhoi12@gmail.com>"]
keywords = ["cli", "crawler", "bot-detection", "security", "scraper"]
categories = ["command-line-utilities", "web-programming::http-client"]
exclude = [
    ".github/",
    "docs/",
    "assets/"
]

[dependencies]
clap = { version = "4.6.4", features = ["derive"] }
colored = "3.1.1"
comfy-table = "7.2.2"
futures = "0.3.33"
indicatif = "0.18.6"
reqwest = { version = "0.13.4", features = ["json"] }
scraper = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
url = "2.5.8"
